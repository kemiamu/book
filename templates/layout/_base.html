<!doctype html>
<html lang="en" x-data="theme()" :data-theme="dark ? 'dark' : 'light'">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{% block title %}{{ site_title }}{% endblock title %}</title>

    <meta name="description" content="A rather humble documentation site." />
    <link rel="icon" type="image/svg+xml" href="{{ base_url }}/img/favicon.svg">
    <link rel="stylesheet" href="{{ base_url }}/css/modern-normalize.css" />
    <link rel="stylesheet" href="{{ base_url }}/css/style-0019.css" />

    <script>
      // apply the theme before first paint so the page never flashes
      // the wrong palette while Alpine.js is still loading
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>

    {% block head %}{% endblock head %}
    <script defer src="{{ base_url }}/js/alpine.min.js"></script>
    {% include "macros/_scripts.html" %}
  </head>
  <body>
    {% block body %}{% endblock body %}
  </body>
</html>
