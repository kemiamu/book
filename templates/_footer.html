<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <p class="title">{{ site_title }}</p>
        <p class="text-muted">A rather humble documentation site.</p>
      </div>
      <div class="footer-links">
        <p class="title">Links</p>
        <ul>
          <li><a href="/" class="text-muted">Home</a></li>
          {% if user %}
          <li><a href="/edit" class="text-muted">New Entry</a></li>
          <li><a href="/profile" class="text-muted">Profile</a></li>
          <li><a href="/auth/sign-out" :class="confirm ? 'text-danger' : 'text-muted'" x-data="{ confirm: false }" @click.prevent="if (confirm) { window.location.href = '/auth/sign-out' } else { confirm = true; setTimeout(() => confirm = false, 3000) }" x-text="confirm ? 'Confirm Sign Out?' : 'Sign Out'"></a></li>
          {% endif %}
          {% if user and entry_slug %}
          <li><a href="#" :class="confirm ? 'text-danger' : 'text-muted'" x-data="{ confirm: false }" @click.prevent="if (confirm) { deleteEntry('{{ entry_slug }}') } else { confirm = true; setTimeout(() => confirm = false, 3000) }" x-text="confirm ? 'Confirm Delete?' : 'Delete This Entry'"></a></li>
          {% endif %}
        </ul>
      </div>
    </div>
    <hr />
    <div class="footer-bottom">
      <p class="text-faint">
        &copy; 2026 by Contributors 🥥 &mdash;
        licensed under
        <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>
      </p>
    </div>
  </div>
  {% if user and entry_slug %}
  <script>
  function deleteEntry(slug) {
    fetch('/' + encodeURIComponent(slug) + '/delete', { method: 'POST' })
      .then(r => r.json())
      .then(data => {
        if (data.redirect) {
          window.location.href = data.redirect;
        }
      });
  }
  </script>
  {% endif %}
</footer>
