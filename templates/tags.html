{% import "macros/_listing.html" as listing %}
{% extends "_base.html" %}
{% block title %}{{ tag }} - {{ site_title }}{% endblock title %}
{% block body %}
<section class="hero">

{{ listing::listing(title="Entries", items=entries) }}
{% endblock body %}
